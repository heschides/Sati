name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SatiLogica.slnx

      - name: Build
        run: dotnet build SatiLogica.slnx --configuration Release --no-restore

      - name: Build Demo client configuration
        run: dotnet build Sati.csproj --configuration Demo --no-restore

      - name: Test
        run: dotnet test SatiLogica.slnx --configuration Release --no-build --no-restore

      - name: Test signing portal page behavior
        run: node --test Sati.Portal.Tests/portal-ui.test.cjs
